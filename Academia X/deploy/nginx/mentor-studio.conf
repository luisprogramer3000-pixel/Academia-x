# =============================================================================
# Mentor Studio Global — nginx en VPS (Hostinger)
#
# Copiar a /etc/nginx/sites-available/mentor-studio y enlazar:
#   ln -s /etc/nginx/sites-available/mentor-studio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ANTES DE USARLO:
#   Arrancar con el bloque HTTPS comentado, emitir los certificados
#   (ver docs/deployment-hostinger.md) y recién entonces descomentarlo.
#   nginx no arranca si apunta a un certificado que todavía no existe.
# =============================================================================

upstream mentor_studio {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Cabeceras comunes del proxy hacia Next.js
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# HTTP: validación de Let's Encrypt y redirección a HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mentorstudioglobal.com www.mentorstudioglobal.com *.mentorstudioglobal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS: el dominio sin www redirige a https://www.mentorstudioglobal.com
# (la dirección pública oficial: NEXT_PUBLIC_APP_URL)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentorstudioglobal.com;

    ssl_certificate     /etc/letsencrypt/live/mentorstudioglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorstudioglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.mentorstudioglobal.com$request_uri;
}

# -----------------------------------------------------------------------------
# HTTPS: www + subdominio de cada academia (*.mentorstudioglobal.com)
# Requiere un certificado wildcard (desafío DNS-01).
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mentorstudioglobal.com *.mentorstudioglobal.com;

    ssl_certificate     /etc/letsencrypt/live/mentorstudioglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorstudioglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Las subidas permiten hasta 20MB; el valor por defecto de nginx (1MB)
    # devolvería un 413 y el profesor vería "error al subir" sin más explicación.
    client_max_body_size 25m;

    # La generación de cursos con IA puede tardar más que el minuto por defecto.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos subidos: los sirve nginx directamente desde el disco persistente,
    # sin pasar por Node. Debe coincidir con UPLOADS_DIR del .env.production.local
    location /uploads/ {
        alias /var/www/mentor-studio-uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        # Nunca ejecutar nada que venga de esta carpeta
        location ~ \.(php|phtml|pl|py|cgi|sh)$ { deny all; }
    }

    # Assets compilados de Next: inmutables, se cachean agresivamente
    location /_next/static/ {
        proxy_pass http://mentor_studio;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mentor_studio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# -----------------------------------------------------------------------------
# Dominios personalizados de clientes del plan Academy Executive.
# NO editar a mano: usar deploy/add-custom-domain.sh, que emite el certificado
# y genera el archivo de cada cliente en /etc/nginx/sites-available/.
# -----------------------------------------------------------------------------
